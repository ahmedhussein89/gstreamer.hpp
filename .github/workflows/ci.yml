name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LLVM_VERSION: 22
  # Runtime plugins the test suite exercises (fakesrc, videotestsrc,
  # videoconvert, videoscale, decodebin, autovideosink).
  GST_PACKAGES: >-
    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good
    libgtest-dev libspdlog-dev libfmt-dev

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- ${{ env.LLVM_VERSION }}
          sudo apt-get install -y --no-install-recommends clang-format-${{ env.LLVM_VERSION }}

      - name: clang-format check
        run: |
          find include -name '*.hpp' -print0 \
            | xargs -0 clang-format-${{ env.LLVM_VERSION }} --dry-run -Werror

      - name: check-concepts
        run: bash scripts/check-concepts.sh

  test:
    name: Build & Test (${{ matrix.config }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install GStreamer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ env.GST_PACKAGES }}

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DGST_BUILD_TUTORIALS=OFF \
            -DGST_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install GStreamer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ env.GST_PACKAGES }}

      - name: Install clang + clang-tidy
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- ${{ env.LLVM_VERSION }}
          sudo apt-get install -y --no-install-recommends \
            clang-${{ env.LLVM_VERSION }} \
            clang-tidy-${{ env.LLVM_VERSION }}

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DGST_BUILD_TUTORIALS=OFF \
            -DGST_BUILD_TESTS=ON \
            -DGST_ENABLE_CLANG_TIDY=ON

      - name: Build (tidy errors fail the build)
        run: cmake --build build

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install GStreamer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ env.GST_PACKAGES }}

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGST_BUILD_TUTORIALS=OFF \
            -DGST_BUILD_TESTS=ON \
            -DGST_ENABLE_SANITIZERS=ON \
            -DGST_SANITIZER=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          # Suppresses third-party driver leaks only — see the file for why.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.lsan-suppressions.txt
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Build & Test (Windows, Release)
    runs-on: windows-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install GStreamer
        run: choco install -y gstreamer gstreamer-devel

      - name: Add GStreamer bin to PATH
        run: echo "C:\gstreamer\1.0\msvc_x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install GTest (vcpkg)
        run: vcpkg install gtest:x64-windows

      - name: Configure
        run: >
          cmake -B build -S .
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DGST_BUILD_TUTORIALS=OFF
          -DGST_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
