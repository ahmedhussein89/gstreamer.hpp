name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LLVM_VERSION: 20

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git wget ca-certificates lsb-release software-properties-common gnupg

      - name: Add LLVM apt repo
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | bash -s -- ${{ env.LLVM_VERSION }}

      - name: Install clang-format
        run: apt-get install -y --no-install-recommends clang-format-${{ env.LLVM_VERSION }}

      - name: clang-format check
        run: |
          find include -name '*.hpp' -print0 \
            | xargs -0 clang-format-${{ env.LLVM_VERSION }} --dry-run -Werror

      - name: check-concepts
        run: bash scripts/check-concepts.sh

  build:
    name: Build (${{ matrix.config }})
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install apt packages
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build git pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtest-dev libspdlog-dev libfmt-dev \
            wget ca-certificates lsb-release software-properties-common gnupg

      - name: Add LLVM apt repo
        run: wget -qO- https://apt.llvm.org/llvm.sh | bash -s -- ${{ env.LLVM_VERSION }}

      - name: Install clang
        run: apt-get install -y --no-install-recommends clang-${{ env.LLVM_VERSION }}

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DGST_BUILD_TUTORIALS=OFF \
            -DGST_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-binaries-${{ matrix.config }}
          path: build/tests/
          retention-days: 1

  test:
    name: Test (${{ matrix.config }})
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install apt packages
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build git pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtest-dev libspdlog-dev libfmt-dev \
            wget ca-certificates lsb-release software-properties-common gnupg

      - name: Add LLVM apt repo
        run: wget -qO- https://apt.llvm.org/llvm.sh | bash -s -- ${{ env.LLVM_VERSION }}

      - name: Install clang
        run: apt-get install -y --no-install-recommends clang-${{ env.LLVM_VERSION }}

      - name: Configure (for ctest)
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DGST_BUILD_TUTORIALS=OFF \
            -DGST_BUILD_TESTS=ON

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries-${{ matrix.config }}
          path: build/tests/

      - name: Make test binaries executable
        run: chmod +x build/tests/*

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install apt packages
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build git pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtest-dev libspdlog-dev libfmt-dev \
            wget ca-certificates lsb-release software-properties-common gnupg

      - name: Add LLVM apt repo
        run: wget -qO- https://apt.llvm.org/llvm.sh | bash -s -- ${{ env.LLVM_VERSION }}

      - name: Install clang + clang-tidy
        run: |
          apt-get install -y --no-install-recommends \
            clang-${{ env.LLVM_VERSION }} \
            clang-tidy-${{ env.LLVM_VERSION }}

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DGST_BUILD_TUTORIALS=OFF \
            -DGST_BUILD_TESTS=ON \
            -DGST_ENABLE_CLANG_TIDY=ON

      - name: Build (tidy errors fail the build)
        run: cmake --build build

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install apt packages
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            cmake ninja-build git pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtest-dev libspdlog-dev libfmt-dev \
            wget ca-certificates lsb-release software-properties-common gnupg

      - name: Add LLVM apt repo
        run: wget -qO- https://apt.llvm.org/llvm.sh | bash -s -- ${{ env.LLVM_VERSION }}

      - name: Install clang
        run: apt-get install -y --no-install-recommends clang-${{ env.LLVM_VERSION }}

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DGST_BUILD_TUTORIALS=OFF \
            -DGST_BUILD_TESTS=ON \
            -DGST_ENABLE_SANITIZERS=ON \
            -DGST_SANITIZER=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
